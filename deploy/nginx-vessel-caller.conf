limit_req_zone $binary_remote_addr zone=vessel_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vessel_api:10m rate=20r/s;
log_format vessel_sanitized '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent" request_id=$request_id';

upstream vessel_caller_backend {
    include /etc/nginx/vessel-caller/active-upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name vesselcalls.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://vesselcalls.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name vesselcalls.com;
    root /opt/vessel-caller/current/frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vesselcalls.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vesselcalls.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VesselCallerTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;

    access_log /var/log/nginx/vessel-caller.access.log vessel_sanitized;
    error_log /var/log/nginx/vessel-caller.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob: https://*.digitaloceanspaces.com; connect-src 'self' https://*.digitaloceanspaces.com https://*.ingest.sentry.io; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; upgrade-insecure-requests" always;

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/vessel-caller;
        internal;
    }

    location /api/ {
        if (-f /var/lib/vessel-caller/maintenance) {
            return 503;
        }

        limit_req zone=vessel_api burst=40 nodelay;
        proxy_pass http://vessel_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(auth/(login|register|forgot-password|resend-verification|verify-email|reset-password|mfa/verify)|invitations/accept)$ {
        if (-f /var/lib/vessel-caller/maintenance) {
            return 503;
        }

        limit_req zone=vessel_auth burst=5 nodelay;
        proxy_pass http://vessel_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /staff/ {
        if (-f /var/lib/vessel-caller/maintenance) {
            return 503;
        }

        include /etc/nginx/vessel-caller/staff-allowlist.conf;
        proxy_pass http://vessel_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /static/ {
        alias /opt/vessel-caller/current/backend/staticfiles/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        if (-f /var/lib/vessel-caller/maintenance) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
    }
}
