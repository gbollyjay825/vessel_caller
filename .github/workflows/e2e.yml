name: Browser and Accessibility Tests

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: vessel_caller_e2e
          POSTGRES_USER: vessel_caller
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vessel_caller -d vessel_caller_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VC_ENVIRONMENT: test
      DJANGO_SETTINGS_MODULE: vessel_caller.settings.test
      VC_SECRET_KEY: ci-secret-key-that-is-not-used-outside-ci
      VC_DATABASE_URL: postgresql://vessel_caller:ci-only-password@127.0.0.1:5432/vessel_caller_e2e
      VC_REDIS_URL: redis://127.0.0.1:6379/0
      VC_ALLOWED_HOSTS: localhost,127.0.0.1
      VC_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
      VC_FRONTEND_URL: http://127.0.0.1:5173
      VITE_API_PROXY_TARGET: http://127.0.0.1:8002
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --requirement backend/requirements/development.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps
      - name: Generate isolated E2E credential
        shell: bash
        run: |
          password="$(openssl rand -base64 36 | tr -d '\n')Aa1!"
          echo "::add-mask::${password}"
          {
            echo "VC_E2E_PASSWORD=${password}"
            echo "E2E_PASSWORD=${password}"
          } >> "${GITHUB_ENV}"
      - name: Prepare database
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e --force
      - name: Start application
        run: |
          python backend/manage.py runserver 127.0.0.1:8002 > /tmp/vessel-backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/vessel-frontend.log 2>&1 &
          deploy/scripts/wait-for-http.sh http://127.0.0.1:8002/api/readiness 60
          deploy/scripts/wait-for-http.sh http://127.0.0.1:5173/ 60
      - name: Playwright journeys
        working-directory: frontend
        run: |
          npm run e2e
          npm run e2e:mocked
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/vessel-backend.log
            /tmp/vessel-frontend.log
          if-no-files-found: warn
          retention-days: 14
