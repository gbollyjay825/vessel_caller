name: Staging Capacity Gate

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
    secrets:
      LOAD_TEST_COOKIE:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Qualified release tag deployed to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vessel-caller-staging-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release || github.sha }}
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
      - name: Run 50-user staging capacity test
        env:
          BASE_URL: https://staging.vesselcalls.com
          LOAD_TEST_COOKIE: ${{ secrets.LOAD_TEST_COOKIE }}
          EXPECTED_RELEASE: ${{ inputs.release }}
        run: k6 run --summary-export=load-summary.json tests/load/staging.js
      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-load-${{ inputs.release }}
          path: load-summary.json
          if-no-files-found: error
          retention-days: 90
