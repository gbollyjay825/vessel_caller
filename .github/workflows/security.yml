name: Security and Supply Chain

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scanners and locked dependencies
        run: |
          python -m pip install --require-hashes --requirement backend/requirements/development.txt
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0
          npm ci --prefix frontend
      - name: Python dependency audit
        run: pip-audit --requirement backend/requirements/production.txt
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Python static security analysis
        working-directory: backend
        run: bandit --recursive . --exclude tests --severity-level medium
      - name: Semgrep
        run: |
          semgrep_env="${RUNNER_TEMP}/vessel-semgrep-1.180.0"
          python -m venv "${semgrep_env}"
          "${semgrep_env}/bin/python" -m pip install \
            --disable-pip-version-check semgrep==1.180.0
          "${semgrep_env}/bin/semgrep" scan \
            --config p/owasp-top-ten --error --metrics=off .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: trivy-results.sarif
      - name: Build software bill of materials
        if: always()
        run: |
          cyclonedx-py requirements backend/requirements/production.txt --output-file backend-sbom.json
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-file frontend-sbom.json --package-lock-only frontend/package.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-sbom
          path: |
            backend-sbom.json
            frontend-sbom.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
