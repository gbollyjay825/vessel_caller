[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["legacy_fastapi", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"vessel_caller/settings/*.py" = ["F403", "F405", "S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vessel_caller.settings.test"

[tool.coverage.run]
branch = true
source = ["accounts", "api", "audit", "billing", "operations", "organizations", "vessel_caller"]
omit = [
  "legacy_fastapi/*",
  "manage.py",
  "tests/*",
  "*/migrations/*",
  "*/admin.py",
  "*/asgi.py",
  "*/wsgi.py",
  "vessel_caller/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
