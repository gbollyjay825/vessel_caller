name: Staging OWASP Baseline

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release:
        description: Qualified release tag deployed to staging
        required: true
        type: string
  schedule:
    - cron: "43 3 * * 3"

permissions:
  contents: read

concurrency:
  group: vessel-caller-staging-dast
  cancel-in-progress: true

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release || github.sha }}
      - name: Verify deployed release identity
        env:
          EXPECTED_RELEASE: ${{ inputs.release }}
        run: |
          release="$(
            curl \
              --fail \
              --silent \
              --show-error \
              https://staging.vesselcalls.com/api/health |
              jq -er '.release.tag'
          )"
          if [[ -n "${EXPECTED_RELEASE}" ]]; then
            test "${release}" = "${EXPECTED_RELEASE}"
          else
            [[ "${release}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]
          fi
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://staging.vesselcalls.com
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j
          fail_action: true
          allow_issue_writing: false
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-zap-baseline
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 90
