limit_req_zone $binary_remote_addr zone=vessel_staging_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vessel_staging_api:10m rate=20r/s;
log_format vessel_staging_sanitized '$remote_addr - $remote_user [$time_local] '
                                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                    '"$http_user_agent" request_id=$request_id';

upstream vessel_caller_staging_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.vesselcalls.com staging-api.vesselcalls.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# The legacy API hostname remains a non-routable certificate endpoint.  The
# Droplet serves the SPA and its same-origin API together on the staging host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.vesselcalls.com;

    ssl_certificate /etc/letsencrypt/live/staging-api.vesselcalls.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.vesselcalls.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VesselCallerStagingApiTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.vesselcalls.com;
    root /opt/vessel-caller/slots/staging/current/frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/staging.vesselcalls.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.vesselcalls.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VesselCallerStagingTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/vessel-caller-staging.access.log vessel_staging_sanitized;
    error_log /var/log/nginx/vessel-caller-staging.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob: https://*.digitaloceanspaces.com; connect-src 'self' https://*.digitaloceanspaces.com https://*.ingest.sentry.io; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; upgrade-insecure-requests" always;

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/vessel-caller;
        internal;
    }

    location /api/ {
        limit_req zone=vessel_staging_api burst=40 nodelay;
        proxy_pass http://vessel_caller_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(auth/(login|register|forgot-password|resend-verification|verify-email|reset-password|mfa/verify)|invitations/accept)$ {
        limit_req zone=vessel_staging_auth burst=5 nodelay;
        proxy_pass http://vessel_caller_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
