name: Security and Supply Chain

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scanners and locked dependencies
        run: |
          python -m pip install --require-hashes --requirement backend/requirements/development.txt
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0
          npm ci --prefix frontend
      - name: Python dependency audit
        run: pip-audit --requirement backend/requirements/production.txt
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Python static security analysis
        working-directory: backend
        run: bandit --recursive . --exclude tests --severity-level medium
      - name: Semgrep
        run: |
          semgrep_env="${RUNNER_TEMP}/vessel-semgrep-1.180.0"
          python -m venv "${semgrep_env}"
          "${semgrep_env}/bin/python" -m pip install \
            --disable-pip-version-check semgrep==1.180.0
          "${semgrep_env}/bin/semgrep" scan \
            --config p/owasp-top-ten --error --metrics=off .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: trivy-results.sarif
      - name: Build software bill of materials
        if: always()
        run: |
          cyclonedx-py requirements backend/requirements/production.txt --output-file backend-sbom.json
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-file frontend-sbom.json --package-lock-only frontend/package.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sbom
          path: |
            backend-sbom.json
            frontend-sbom.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
