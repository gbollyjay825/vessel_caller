---
- name: Read-only production verification
  hosts: vessel_caller
  become: true
  gather_facts: false
  tasks:
    - name: Validate Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Require the staging Django service
      ansible.builtin.uri:
        url: http://127.0.0.1:8010/api/readiness
        headers:
          Host: staging-api.vesselcalls.com
          X-Forwarded-Proto: https
        status_code: 200
        timeout: 5
      changed_when: false
      when: vessel_staging_runtime_enabled | bool

    - name: Check public sites
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code:
          - 200
          - 301
          - 302
        timeout: 20
      loop:
        - https://vesselcalls.com/api/health
        - https://flexschools.ng/
      changed_when: false
