---
- name: Create production release slots
  ansible.builtin.file:
    path: "{{ vessel_app_root }}/slots/{{ item.name }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "0750"
  loop:
    - name: production-blue
      group: "{{ vessel_production_group }}"
    - name: production-green
      group: "{{ vessel_production_group }}"
  when: vessel_production_runtime_enabled | bool

- name: Create staging release slot
  ansible.builtin.file:
    path: "{{ vessel_app_root }}/slots/staging"
    state: directory
    owner: root
    group: "{{ vessel_staging_group }}"
    # Nginx must traverse the staging slot to reach the public frontend build,
    # but neither Nginx nor the runtime account may list or replace `current`.
    mode: "0751"
  when: vessel_staging_runtime_enabled | bool

- name: Install release and operational scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/scripts/{{ item }}"
    dest: "/usr/local/lib/vessel-caller/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - verify-release.sh
    - snapshot-release.py
    - install-release.sh
    - promote-release.sh
    - deploy-release.sh
    - staging-writer-guard.sh
    - staging-compatibility-guard.sh
    - staging-lifecycle-state.sh
    - release-target-policy.sh
    - postgres-backup.sh
    - postgres-restore.sh
    - database-manifest.sh
    - libpq-env.sh
    - monitor-health.sh
    - prune-releases.sh
    - smoke-test.sh
    - enable-system-admin-mutations.sh

- name: Install restricted deployment entrypoint
  ansible.builtin.file:
    src: /usr/local/lib/vessel-caller/deploy-release.sh
    dest: /usr/local/sbin/vessel-caller-deploy
    state: link
    force: true

- name: Restrict deployment sudo surface
  ansible.builtin.copy:
    dest: /etc/sudoers.d/vessel-caller-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by Vessel Caller Ansible; disabled runtimes receive no sudo rule.
      {% if vessel_staging_runtime_enabled | bool %}
      {{ vessel_deploy_user }} ALL=(root) NOPASSWD: /usr/local/sbin/vessel-caller-deploy staging /var/tmp/vessel-caller-v*.tar.gz
      {% endif %}
      {% if vessel_production_runtime_enabled | bool %}
      {{ vessel_deploy_user }} ALL=(root) NOPASSWD: /usr/local/sbin/vessel-caller-deploy production /var/tmp/vessel-caller-v*.tar.gz
      {% endif %}

- name: Pin production release-signing public key
  ansible.builtin.copy:
    dest: "{{ vessel_config_root }}/release-signing-public.pem"
    owner: root
    group: root
    mode: "0644"
    content: "{{ vessel_release_signing_public_key }}"
  when:
    - vessel_production_runtime_enabled | bool

- name: Pin staging release-signing public key
  ansible.builtin.copy:
    dest: "{{ vessel_config_root }}/staging-release-signing-public.pem"
    owner: root
    group: root
    mode: "0644"
    content: "{{ vessel_staging_release_signing_public_key }}"
  when: vessel_staging_runtime_enabled | bool

- name: Install production systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vessel-caller-web@.service
    - vessel-caller-worker@.service
    - vessel-caller-prepare@.service
    - redis-vessel-caller-production.service
  when: vessel_production_runtime_enabled | bool
  notify: Reload systemd

- name: Install staging systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vessel-caller-staging-web.service
    - vessel-caller-staging-worker.service
    - vessel-caller-staging-prepare.service
    - redis-vessel-caller-staging.service
  when: vessel_staging_runtime_enabled | bool
  notify: Reload systemd

- name: Configure isolated authenticated production Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ vessel_config_root }}/redis-production.conf"
    owner: root
    group: "{{ vessel_production_redis_group }}"
    mode: "0640"
  vars:
    runtime_environment: production
    runtime_redis_port: "{{ vessel_production_redis_port }}"
    runtime_redis_password: "{{ vessel_production_redis_password }}"
    runtime_redis_maxmemory: 512mb
  no_log: true
  when: vessel_production_runtime_enabled | bool
  notify: Restart Vessel Caller production Redis

- name: Configure isolated authenticated staging Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ vessel_config_root }}/redis-staging.conf"
    owner: root
    group: "{{ vessel_staging_redis_group }}"
    mode: "0640"
  vars:
    runtime_environment: staging
    runtime_redis_port: "{{ vessel_staging_redis_port }}"
    runtime_redis_password: "{{ vessel_staging_redis_password }}"
    runtime_redis_maxmemory: 192mb
  no_log: true
  when: vessel_staging_runtime_enabled | bool
  notify: Restart Vessel Caller staging Redis

- name: Fail-close the production System Admin mutation kill switch
  ansible.builtin.copy:
    dest: "{{ vessel_config_root }}/system-admin-mutations-production.flag"
    owner: root
    group: "{{ vessel_production_group }}"
    mode: "0640"
    content: "disabled\n"
  when: vessel_production_runtime_enabled | bool

- name: Fail-close the staging System Admin mutation kill switch
  ansible.builtin.copy:
    dest: "{{ vessel_config_root }}/system-admin-mutations-staging.flag"
    owner: root
    group: "{{ vessel_staging_group }}"
    mode: "0640"
    content: "disabled\n"
  when: vessel_staging_runtime_enabled | bool

- name: Write production slot environments
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ vessel_config_root }}/{{ item.name }}.env"
    owner: root
    group: "{{ vessel_production_group }}"
    mode: "0640"
  vars:
    runtime_environment: production
    runtime_bind: "{{ item.bind }}"
    runtime_database_url: "{{ vessel_production_database_url }}"
    runtime_secret_key: "{{ vessel_secret_key }}"
    runtime_host: "{{ vessel_domain }}"
    runtime_csrf_origin: "https://{{ vessel_domain }}"
    runtime_frontend_url: "https://{{ vessel_domain }}"
    runtime_system_admin_mutation_flag_file: "{{ vessel_config_root }}/system-admin-mutations-production.flag"
    runtime_redis_port: "{{ vessel_production_redis_port }}"
    runtime_redis_password: "{{ vessel_production_redis_password }}"
    runtime_deferred_provider_cutover: "{{ vessel_production_deferred_provider_cutover }}"
    runtime_email_delivery_backend: >-
      {{ 'resend' if ((vessel_production_resend_api_key | length > 0) and ('CHANGE_ME' not in vessel_production_resend_api_key)) else 'disabled' }}
    runtime_resend_api_key: "{{ vessel_production_resend_api_key }}"
    runtime_email_from: "{{ vessel_production_email_from }}"
    runtime_spaces_key: "{{ vessel_production_spaces_key }}"
    runtime_spaces_secret: "{{ vessel_production_spaces_secret }}"
    runtime_spaces_bucket: "{{ vessel_production_spaces_bucket }}"
    runtime_sentry_enabled: "{{ not (vessel_production_deferred_provider_cutover | bool) }}"
    runtime_sentry_dsn: "{{ vessel_production_sentry_dsn }}"
    runtime_mfa_encryption_key: "{{ vessel_production_mfa_encryption_key }}"
  loop:
    - {name: production-blue, bind: "127.0.0.1:8001"}
    - {name: production-green, bind: "127.0.0.1:8002"}
  no_log: true
  when: vessel_production_runtime_enabled | bool

- name: Write staging environment
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ vessel_config_root }}/staging.env"
    owner: root
    group: "{{ vessel_staging_group }}"
    mode: "0640"
  vars:
    runtime_environment: staging
    runtime_bind: 127.0.0.1:8010
    runtime_database_url: "{{ vessel_staging_database_url }}"
    runtime_secret_key: "{{ vessel_staging_secret_key }}"
    runtime_host: "{{ vessel_staging_domain }}"
    runtime_csrf_origin: "{{ vessel_staging_frontend_origin }}"
    runtime_frontend_url: "{{ vessel_staging_frontend_origin }}"
    runtime_system_admin_mutation_flag_file: "{{ vessel_config_root }}/system-admin-mutations-staging.flag"
    runtime_redis_port: "{{ vessel_staging_redis_port }}"
    runtime_redis_password: "{{ vessel_staging_redis_password }}"
    runtime_deferred_provider_cutover: false
    runtime_email_delivery_backend: resend
    runtime_resend_api_key: "{{ vessel_staging_resend_api_key }}"
    runtime_email_from: "{{ vessel_staging_email_from }}"
    runtime_spaces_key: "{{ vessel_staging_spaces_key }}"
    runtime_spaces_secret: "{{ vessel_staging_spaces_secret }}"
    runtime_spaces_bucket: "{{ vessel_staging_spaces_bucket }}"
    runtime_sentry_enabled: true
    runtime_sentry_dsn: "{{ vessel_staging_sentry_dsn }}"
    runtime_mfa_encryption_key: "{{ vessel_staging_mfa_encryption_key }}"
  no_log: true
  when: vessel_staging_runtime_enabled | bool

- name: Verify and enable staging System Admin mutations under the release lock
  ansible.builtin.command:
    argv:
      - /usr/local/lib/vessel-caller/enable-system-admin-mutations.sh
      - staging
      - "{{ vessel_staging_system_admin_qualified_release_tag }}"
      - "{{ vessel_staging_system_admin_qualified_release_sha }}"
      - "{{ vessel_staging_resend_api_key | hash('sha256') }}"
      - "{{ vessel_staging_email_from | hash('sha256') }}"
  no_log: true
  when:
    - vessel_staging_runtime_enabled | bool
    - vessel_staging_system_admin_mutations_enabled | bool

- name: Verify and enable production System Admin mutations under the release lock
  ansible.builtin.command:
    argv:
      - /usr/local/lib/vessel-caller/enable-system-admin-mutations.sh
      - production
      - "{{ vessel_production_system_admin_qualified_release_tag }}"
      - "{{ vessel_production_system_admin_qualified_release_sha }}"
      - "{{ vessel_production_resend_api_key | hash('sha256') }}"
      - "{{ vessel_production_email_from | hash('sha256') }}"
  no_log: true
  when:
    - vessel_production_runtime_enabled | bool
    - vessel_production_system_admin_mutations_enabled | bool

- name: Write staging E2E seed environment
  ansible.builtin.template:
    src: e2e.env.j2
    dest: "{{ vessel_config_root }}/staging-e2e.env"
    owner: root
    group: "{{ vessel_staging_group }}"
    mode: "0640"
  no_log: true
  when: vessel_staging_runtime_enabled | bool

- name: Enable isolated production Redis
  ansible.builtin.systemd:
    name: redis-vessel-caller-production.service
    enabled: true
    state: started
    daemon_reload: true
  when: vessel_production_runtime_enabled | bool

- name: Enable isolated staging Redis
  ansible.builtin.systemd:
    name: redis-vessel-caller-staging.service
    enabled: true
    state: started
    daemon_reload: true
  when: vessel_staging_runtime_enabled | bool
