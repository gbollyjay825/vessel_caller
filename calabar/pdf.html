<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vessel Caller — Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#16191D; --slate:#5F6B7A; --soft:#8A95A3; --accent:#1B5FAA; --accent-tint:#E6EFF8;
    --hairline:#E8EAED; --success:#1F9254; --warning:#B6781E; --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;background:#EDEFF2;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--hairline);padding:12px 24px;}
  .toolbar .tb-left{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--slate);font-weight:500;}
  .toolbar .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;}
  .toolbar .actions{display:flex;gap:8px;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13px;font-weight:600;border-radius:6px;
    border:1px solid transparent;padding:8px 14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#15508F;}
  .btn-secondary{background:#fff;color:var(--ink);border-color:#D8DCE1;}
  .btn-secondary:hover{background:#F4F6F8;}
  .page-wrap{padding:32px 16px 64px;display:flex;justify-content:center;}
  .page{background:#fff;width:820px;max-width:100%;box-shadow:0 8px 28px rgba(16,19,29,0.12);border-radius:4px;padding:56px 60px;}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:28px;border-bottom:2px solid var(--ink);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mk{width:44px;height:44px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;}
  .brand .nm{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .brand .sub{font-size:12px;color:var(--slate);}
  .doc-type{text-align:right;}
  .doc-type .label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
  .doc-type .num{font-size:22px;font-weight:700;letter-spacing:-0.01em;margin-top:2px;font-variant-numeric:tabular-nums;}
  .doc-type .meta{font-size:12px;color:var(--slate);margin-top:4px;font-variant-numeric:tabular-nums;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:32px 0;}
  .meta-block .h{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--soft);margin-bottom:8px;}
  .meta-block .v{font-size:14px;}
  .meta-block .v .strong{font-weight:600;font-size:15px;}
  .kvline{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
  .kvline .k{color:var(--slate);}
  .kvline .val{font-weight:500;font-variant-numeric:tabular-nums;}
  table{width:100%;border-collapse:collapse;margin-top:8px;}
  thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);
    padding:10px 12px;border-bottom:1px solid var(--hairline);}
  thead th.num{text-align:right;}
  tbody td{padding:13px 12px;border-bottom:1px solid var(--hairline);font-size:14px;font-variant-numeric:tabular-nums;}
  tbody td.num{text-align:right;}
  tbody td .desc{color:var(--slate);font-size:12px;margin-top:2px;}
  .totals{margin-top:20px;margin-left:auto;width:340px;}
  .totals .row{display:flex;justify-content:space-between;padding:8px 12px;font-size:14px;font-variant-numeric:tabular-nums;}
  .totals .row .lbl{color:var(--slate);}
  .totals .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:14px;}
  .totals .grand .lbl{font-weight:700;font-size:15px;color:var(--ink);}
  .totals .grand .amt{font-weight:700;font-size:22px;}
  .totals .grand .ngn{display:block;text-align:right;font-size:13px;color:var(--slate);font-weight:500;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;}
  .pill.unpaid{color:var(--warning);background:#FBF1DF;}
  .pill.paid{color:var(--success);background:#E7F4EC;}
  .pill.overdue{color:var(--danger);background:#FBEAE7;}
  .note{margin-top:40px;padding:18px 20px;background:#F7F9FB;border:1px solid var(--hairline);border-radius:8px;font-size:12.5px;color:var(--slate);}
  .note .nh{font-weight:600;color:var(--ink);margin-bottom:5px;}
  .sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:56px;}
  .sign .line{border-top:1px solid var(--ink);padding-top:8px;font-size:12px;color:var(--slate);}
  .sign .role{font-weight:600;color:var(--ink);font-size:13px;}
  .foot{margin-top:48px;padding-top:20px;border-top:1px solid var(--hairline);display:flex;justify-content:space-between;font-size:11px;color:var(--soft);}
  .section-h{font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--slate);margin:36px 0 4px;}
  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .page-wrap{padding:0;}
    .page{box-shadow:none;width:auto;padding:0;}
    @page{margin:18mm;}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="tb-left">
      <div class="mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>
      </div>
      <span id="tb-title">Document</span>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="window.close()">Close</button>
      <button class="btn btn-primary" onclick="window.print()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Download PDF
      </button>
    </div>
  </div>
  <div class="page-wrap"><div class="page" id="page"></div></div>

<script>
  const p = new URLSearchParams(location.search);
  const g = (k, d='—') => p.get(k) || d;
  const num = (v) => Number(v||0);
  const usd = (v, dp=2) => '$' + num(v).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
  const ngn = (v) => '₦' + Math.round(num(v)).toLocaleString('en-US');
  const nf = (v, dp=0) => num(v).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
  const fmtDate = (s) => { if(!s) return '—'; const d=new Date(s); return isNaN(d)? s : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };

  const doc = g('doc','invoice');
  const isInvoice = doc === 'invoice';
  document.title = g('port', 'Vessel Caller') + ' — ' + (isInvoice ? 'Invoice ' + g('invoiceNo') : 'Inspection Report ' + g('callRef'));
  document.getElementById('tb-title').textContent = isInvoice ? 'Tax Invoice · ' + g('invoiceNo') : 'Inspection Report · ' + g('callRef');

  const dues = num(g('dues')), fx = num(g('fx',1600));
  const commUsd = num(g('commUsd')), commNgn = num(g('commNgn'));
  const duesNgn = dues * fx, totalUsd = dues, totalNgn = dues * fx;

  const head = `
    <div class="doc-head">
      <div class="brand">
        <div class="mk" id="brand-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg></div>
        <div><div class="nm" id="brand-name">Vessel Caller</div><div class="sub">${g('port','Port of Calabar')} · Vessel & Cargo Inspection</div></div>
      </div>
      <div class="doc-type">
        <div class="label">${isInvoice ? 'Tax Invoice' : 'Inspection Report'}</div>
        <div class="num">${isInvoice ? g('invoiceNo') : g('callRef')}</div>
        <div class="meta">Issued ${fmtDate(g('date'))}</div>
      </div>
    </div>`;

  let body = '';
  if (isInvoice) {
    body = `
    <div class="meta-grid">
      <div class="meta-block">
        <div class="h">Billed for</div>
        <div class="v"><span class="strong">${g('vessel')}</span><br/>${g('type')}<br/>Rotation ${g('callRef')}<br/><span style="color:var(--accent);font-weight:600">${g('cargoType')} cargo</span></div>
      </div>
      <div class="meta-block" style="text-align:right">
        <div class="h">Payment</div>
        <div class="kvline"><span class="k">Status</span><span class="val"><span class="pill ${g('invStatus','unpaid')}">${{paid:'Paid',unpaid:'Unpaid',overdue:'Overdue'}[g('invStatus','unpaid')] || 'Unpaid'}</span></span></div>
        <div class="kvline"><span class="k">Due date</span><span class="val">${fmtDate(g('dueDate'))}</span></div>
        ${g('invStatus') === 'paid' ? `<div class="kvline"><span class="k">Paid on</span><span class="val">${fmtDate(g('paidOn'))}</span></div>
        <div class="kvline"><span class="k">Payment ref</span><span class="val">${g('payRef')}</span></div>` : ''}
        <div class="kvline"><span class="k">Exchange rate</span><span class="val">₦${nf(fx)} / USD</span></div>
      </div>
    </div>
    <table>
      <thead><tr><th>Description</th><th class="num">Basis</th><th class="num">Rate</th><th class="num">Amount (USD)</th></tr></thead>
      <tbody>
        <tr>
          <td>NPA harbour dues<div class="desc">Net tonnage × applicable rate${g('jettyType') ? ' · ' + g('jettyType') : ''}</div></td>
          <td class="num">${nf(g('nrt'))} NT</td>
          <td class="num">${usd(num(g('duesRate')),2)}/t</td>
          <td class="num">${usd(dues)}</td>
        </tr>
        <tr>
          <td>Agency commission<div class="desc">${g('commRate')}% of harbour dues</div></td>
          <td class="num">${g('commRate')}%</td>
          <td class="num">—</td>
          <td class="num">${usd(commUsd)}</td>
        </tr>
      </tbody>
    </table>
    <div class="totals">
      <div class="row"><span class="lbl">Harbour dues</span><span>${usd(dues)}</span></div>
      <div class="row"><span class="lbl">Commission (${g('commRate')}%)</span><span>${usd(commUsd)} · ${ngn(commNgn)}</span></div>
      <div class="row grand"><span class="lbl">Total due</span><span class="amt">${usd(totalUsd)}<span class="ngn">${ngn(totalNgn)}</span></span></div>
    </div>
    <div class="note">
      <div class="nh">Payment instructions</div>
      Remit to Nigerian Ports Authority — ${g('port','Port of Calabar')}, within 7 days of issue. Quote invoice number ${g('invoiceNo')} and rotation number ${g('callRef')} on all transfers. Harbour dues are computed from the vessel's net tonnage and the applicable jetty / cargo dues rate.
    </div>
    <div class="foot"><span>${g('port','Port of Calabar')} Vessel & Cargo Inspection Platform</span><span>${g('invoiceNo')} · Page 1 of 1</span></div>`;
  } else {
    body = `
    <div class="meta-grid">
      <div class="meta-block">
        <div class="h">Vessel</div>
        <div class="v"><span class="strong">${g('vessel')}</span><br/>${g('type')}</div>
      </div>
      <div class="meta-block" style="text-align:right">
        <div class="h">Call & berth</div>
        <div class="kvline"><span class="k">Rotation number</span><span class="val">${g('callRef')}</span></div>
        <div class="kvline"><span class="k">Berth / terminal</span><span class="val">${g('berth')}</span></div>
        <div class="kvline"><span class="k">Inspection date</span><span class="val">${fmtDate(g('date'))}</span></div>
      </div>
    </div>

    <div class="section-h">Cargo reconciliation</div>
    <table>
      <thead><tr><th>Item</th><th class="num">Value</th></tr></thead>
      <tbody>
        <tr><td>Cargo category</td><td class="num">${g('cargoType')}</td></tr>
        ${g('cargoType') === 'Liquid' && g('jettyType') ? `<tr><td>Jetty</td><td class="num">${g('jettyType')}${g('jettyName') ? ' · ' + g('jettyName') : ''}</td></tr>` : ''}
        <tr><td>Net tonnage</td><td class="num">${nf(g('nrt'))} NT</td></tr>
        <tr><td>Reconciled surveyor's tonnage</td><td class="num"><strong>${nf(g('tonnage'),2)} MTS</strong></td></tr>
      </tbody>
    </table>

    <div class="section-h">Assessed charges</div>
    <table>
      <thead><tr><th>Charge</th><th class="num">Basis</th><th class="num">Amount</th></tr></thead>
      <tbody>
        <tr><td>NPA harbour dues</td><td class="num">${nf(g('nrt'))} NT × ${usd(num(g('duesRate')),2)}/t</td><td class="num">${usd(dues)}</td></tr>
        <tr><td>Agency commission (${g('commRate')}%)</td><td class="num">₦${nf(fx)}/USD</td><td class="num">${usd(commUsd)} · ${ngn(commNgn)}</td></tr>
      </tbody>
    </table>

    <div class="note">
      <div class="nh">Methodology</div>
      ${g('cargoType')==='Liquid'
        ? "Liquid cargo quantity reconciled by the marine surveyor (reconciled surveyor's tonnage) following ullage / sounding survey. Harbour dues are assessed on the vessel's net tonnage at the applicable jetty rate."
        : "Dry / bulk cargo quantity established by draft survey — initial and final displacement readings less deductibles (ballast, fuel, fresh water and stores) plus the vessel constant. Harbour dues are assessed on the vessel's net tonnage at the dry-cargo rate."}
    </div>

    <div class="sign-grid">
      <div class="sign"><div class="line"><span class="role">Marine Surveyor</span><br/>${g('port','Port of Calabar')} Inspection</div></div>
      <div class="sign"><div class="line"><span class="role">Master / Chief Officer</span><br/>${g('vessel')}</div></div>
    </div>
    <div class="foot"><span>${g('port','Port of Calabar')} Vessel & Cargo Inspection Platform</span><span>${g('callRef')} · Page 1 of 1</span></div>`;
  }

  document.getElementById('page').innerHTML = head + body;

  // ---- Organization branding (logo + name) ----
  // Pulled from the app's data store rather than the query string (data-URL
  // logos are too large for URLs): backend first, localStorage fallback.
  (async () => {
    let org = null;
    try {
      const res = await fetch('/api/state');
      if (res.ok) { const s = await res.json(); org = s.org || null; }
    } catch (e) { /* no backend */ }
    if (!org) {
      try {
        const raw = localStorage.getItem('vessel-caller:v1');
        if (raw) org = (JSON.parse(raw) || {}).org || null;
      } catch (e) { /* ignore */ }
    }
    if (!org || !org.registered) return;
    const nameEl = document.getElementById('brand-name');
    if (nameEl && org.name) nameEl.textContent = org.name;
    const mk = document.getElementById('brand-mark');
    if (mk && org.logo) {
      mk.style.background = '#fff';
      mk.style.border = '1px solid var(--hairline)';
      mk.innerHTML = '';
      const img = document.createElement('img');
      img.src = org.logo;
      img.alt = (org.name || 'Organization') + ' logo';
      img.style.cssText = 'width:100%;height:100%;object-fit:contain;';
      mk.appendChild(img);
    }
  })();
</script>
</body>
</html>
