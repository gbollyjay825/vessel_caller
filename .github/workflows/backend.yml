name: Backend CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "compose.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "compose.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: vessel_caller_test
          POSTGRES_USER: vessel_caller
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vessel_caller -d vessel_caller_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VC_ENVIRONMENT: test
      DJANGO_SETTINGS_MODULE: vessel_caller.settings.test
      VC_SECRET_KEY: ci-secret-key-that-is-not-used-outside-ci
      VC_DATABASE_URL: postgresql://vessel_caller:ci-only-password@127.0.0.1:5432/vessel_caller_test
      VC_REDIS_URL: redis://127.0.0.1:6379/0
      VC_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      VC_CSRF_TRUSTED_ORIGINS: http://localhost:5173
      VC_FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement backend/requirements/development.txt
      - name: Lint and format check
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        working-directory: backend
        run: mypy .
      - name: Django system and migration checks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Test with branch coverage
        working-directory: backend
        run: >-
          python -m pytest
          --cov=.
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=90
      - name: Enforce independent line and branch thresholds
        working-directory: backend
        run: >-
          python scripts/check_coverage_thresholds.py coverage.json
          --minimum-line 90
          --minimum-branch 85
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: error
          retention-days: 14
