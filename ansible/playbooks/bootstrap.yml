---
- name: Safely bootstrap Vessel Caller beside FlexSchools
  hosts: vessel_caller
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Require explicit FlexSchools preservation guard
      ansible.builtin.assert:
        that:
          - vessel_preserve_flexschools | bool
          - vessel_domain == "vesselcalls.com"
        fail_msg: >-
          Set vessel_preserve_flexschools=true before bootstrap.

    - name: Keep deferred provider gates fail-closed
      ansible.builtin.assert:
        that:
          - >-
            not (vessel_staging_runtime_enabled | bool)
            or not (vessel_provider_gates_deferred | bool)
          - >-
            not (vessel_production_runtime_enabled | bool)
            or not (vessel_provider_gates_deferred | bool)
            or (vessel_production_deferred_provider_cutover | bool)
          - >-
            not (vessel_production_deferred_provider_cutover | bool)
            or (
              (vessel_production_runtime_enabled | bool)
              and (vessel_provider_gates_deferred | bool)
            )
          - >-
            not (vessel_staging_application_ready | bool)
            or (vessel_staging_runtime_enabled | bool)
          - >-
            not (vessel_backups_enabled | bool)
            or (vessel_production_runtime_enabled | bool)
          - >-
            not (vessel_staging_system_admin_mutations_enabled | bool)
            or (
              (vessel_staging_runtime_enabled | bool)
              and (vessel_staging_application_ready | bool)
              and (vessel_staging_system_admin_qualified_release_tag is match('^v[0-9]+\\.[0-9]+\\.[0-9]+([-.][0-9A-Za-z.-]+)?$'))
              and (vessel_staging_system_admin_qualified_release_sha is match('^[0-9a-f]{40}$'))
            )
          - >-
            not (vessel_production_system_admin_mutations_enabled | bool)
            or (
              (vessel_production_runtime_enabled | bool)
              and (vessel_backups_enabled | bool)
              and (vessel_production_resend_api_key | length > 0)
              and ('CHANGE_ME' not in vessel_production_resend_api_key)
              and (vessel_production_email_from | length > 0)
              and (vessel_production_system_admin_qualified_release_tag is match('^v[0-9]+\\.[0-9]+\\.[0-9]+([-.][0-9A-Za-z.-]+)?$'))
              and (vessel_production_system_admin_qualified_release_sha is match('^[0-9a-f]{40}$'))
            )
        fail_msg: >-
          Deferred provider gates cannot enable staging. Production may use the
          explicit deferred-provider cutover only while those gates remain
          deferred; staging readiness requires staging runtime, and backups
          require production runtime. System Admin mutations additionally
          require a qualified staging application, or a production runtime
          with verified backups and live Resend delivery, respectively. Sentry
          remains governed independently by the deferred-provider gate.

    - name: Require status-aware runtime in every System Admin rollback slot
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.port }}/api/readiness"
        headers:
          Host: "{{ item.host }}"
          X-Forwarded-Proto: https
        return_content: true
        status_code: 200
        timeout: 5
      register: system_admin_capability_probe
      changed_when: false
      failed_when: >-
        system_admin_capability_probe.status != 200
        or system_admin_capability_probe.json.status != 'ready'
        or system_admin_capability_probe.json.release.tag != item.expected_tag
        or system_admin_capability_probe.json.release.sha != item.expected_sha
        or not (
          system_admin_capability_probe.json.get('capabilities', {}).get(
            'organizationAccessStatus', false
          ) | bool
        )
        or not (
          system_admin_capability_probe.json.get('capabilities', {}).get(
            'systemAdminEmailDeliveryReady', false
          ) | bool
        )
      loop:
        - port: 8010
          host: "{{ vessel_staging_domain }}"
          enabled: "{{ vessel_staging_system_admin_mutations_enabled }}"
          expected_tag: "{{ vessel_staging_system_admin_qualified_release_tag }}"
          expected_sha: "{{ vessel_staging_system_admin_qualified_release_sha }}"
        - port: 8001
          host: "{{ vessel_domain }}"
          enabled: "{{ vessel_production_system_admin_mutations_enabled }}"
          expected_tag: "{{ vessel_production_system_admin_qualified_release_tag }}"
          expected_sha: "{{ vessel_production_system_admin_qualified_release_sha }}"
        - port: 8002
          host: "{{ vessel_domain }}"
          enabled: "{{ vessel_production_system_admin_mutations_enabled }}"
          expected_tag: "{{ vessel_production_system_admin_qualified_release_tag }}"
          expected_sha: "{{ vessel_production_system_admin_qualified_release_sha }}"
      when: item.enabled | bool

    - name: Require release trust for enabled runtimes
      ansible.builtin.assert:
        that:
          - vessel_deploy_authorized_keys | length > 0
          - >-
            not (vessel_production_runtime_enabled | bool)
            or "'CHANGE_ME' not in vessel_release_signing_public_key"
          - >-
            not (vessel_staging_runtime_enabled | bool)
            or "'CHANGE_ME' not in vessel_staging_release_signing_public_key"
        fail_msg: >-
          Enabled runtimes require a restricted deployment public key and the
          independently pinned release-signing public key for each target.
      when:
        - >-
          (vessel_staging_runtime_enabled | bool)
          or (vessel_production_runtime_enabled | bool)
      no_log: true

    - name: Require non-placeholder staging provider configuration
      ansible.builtin.assert:
        that:
          - "'CHANGE_ME' not in vessel_staging_database_url"
          - "'CHANGE_ME' not in vessel_staging_secret_key"
          - "'CHANGE_ME' not in vessel_staging_e2e_password"
          - "'CHANGE_ME' not in vessel_staging_resend_api_key"
          - "'CHANGE_ME' not in vessel_staging_email_from"
          - "'CHANGE_ME' not in vessel_staging_spaces_key"
          - "'CHANGE_ME' not in vessel_staging_spaces_secret"
          - "'CHANGE_ME' not in vessel_staging_spaces_bucket"
          - "'CHANGE_ME' not in vessel_spaces_region"
          - "'CHANGE_ME' not in vessel_spaces_endpoint_url"
          - "'CHANGE_ME' not in vessel_staging_redis_password"
          - "'CHANGE_ME' not in vessel_staging_mfa_encryption_key"
          - "'CHANGE_ME' not in vessel_staging_proxy_secret"
          - "'CHANGE_ME' not in vessel_staging_sentry_dsn"
          - vessel_staging_mfa_encryption_key != vessel_staging_secret_key
          - vessel_staging_e2e_password | length >= 20
          - vessel_staging_redis_password | length >= 32
          - vessel_staging_mfa_encryption_key | length >= 48
          - vessel_staging_mfa_encryption_key is match('^[A-Za-z0-9_+/=-]{48,}$')
          - vessel_staging_proxy_secret is match('^[A-Za-z0-9_-]{43,}$')
        fail_msg: >-
          Provision approved staging providers and load their values through
          Ansible Vault before enabling the staging runtime.
      when: vessel_staging_runtime_enabled | bool
      no_log: true

    - name: Require non-placeholder production core and storage configuration
      ansible.builtin.assert:
        that:
          - "'CHANGE_ME' not in vessel_production_database_url"
          - "'CHANGE_ME' not in vessel_secret_key"
          - "'CHANGE_ME' not in vessel_production_email_from"
          - "'CHANGE_ME' not in vessel_production_spaces_key"
          - "'CHANGE_ME' not in vessel_production_spaces_secret"
          - "'CHANGE_ME' not in vessel_production_spaces_bucket"
          - "'CHANGE_ME' not in vessel_spaces_region"
          - "'CHANGE_ME' not in vessel_spaces_endpoint_url"
          - "'CHANGE_ME' not in vessel_production_redis_password"
          - "'CHANGE_ME' not in vessel_production_mfa_encryption_key"
          - vessel_production_mfa_encryption_key != vessel_secret_key
          - vessel_production_redis_password | length >= 32
          - vessel_production_mfa_encryption_key | length >= 48
          - vessel_production_mfa_encryption_key is match('^[A-Za-z0-9_+/=-]{48,}$')
        fail_msg: >-
          Provision approved production database, storage, and cryptographic
          configuration through Ansible Vault before enabling production.
      when: vessel_production_runtime_enabled | bool
      no_log: true

    - name: Require production messaging and telemetry outside deferred cutover
      ansible.builtin.assert:
        that:
          - vessel_production_resend_api_key | length > 0
          - "'CHANGE_ME' not in vessel_production_resend_api_key"
          - vessel_production_email_from | length > 0
          - "'CHANGE_ME' not in vessel_production_email_from"
          - vessel_production_sentry_dsn | length > 0
          - "'CHANGE_ME' not in vessel_production_sentry_dsn"
        fail_msg: >-
          Production Resend and Sentry credentials are required unless the
          explicit deferred-provider cutover is active.
      when:
        - vessel_production_runtime_enabled | bool
        - not (vessel_production_deferred_provider_cutover | bool)
      no_log: true

    - name: Keep deferred production telemetry disabled and reject placeholder email keys
      ansible.builtin.assert:
        that:
          - vessel_production_sentry_dsn | length == 0
          - >-
            (vessel_production_resend_api_key | length == 0)
            or (
              ('CHANGE_ME' not in vessel_production_resend_api_key)
              and (vessel_production_email_from | length > 0)
              and ('CHANGE_ME' not in vessel_production_email_from)
            )
        fail_msg: >-
          Deferred production telemetry must not retain an unqualified Sentry
          credential. Resend delivery is governed independently, but any
          configured key must be a real protected value rather than a
          placeholder.
      when:
        - vessel_production_runtime_enabled | bool
        - vessel_production_deferred_provider_cutover | bool
      no_log: true

    - name: Require provider isolation between enabled runtimes
      ansible.builtin.assert:
        that:
          - vessel_production_database_url != vessel_staging_database_url
          - vessel_secret_key != vessel_staging_secret_key
          - vessel_production_mfa_encryption_key != vessel_staging_mfa_encryption_key
          - >-
            (vessel_production_resend_api_key | length == 0)
            or vessel_production_resend_api_key != vessel_staging_resend_api_key
          - vessel_production_spaces_key != vessel_staging_spaces_key
          - vessel_production_spaces_secret != vessel_staging_spaces_secret
          - vessel_production_spaces_bucket != vessel_staging_spaces_bucket
          - vessel_production_redis_password != vessel_staging_redis_password
          - >-
            (vessel_production_deferred_provider_cutover | bool)
            or vessel_production_sentry_dsn != vessel_staging_sentry_dsn
        fail_msg: Staging and production provider credentials must be isolated.
      when:
        - vessel_staging_runtime_enabled | bool
        - vessel_production_runtime_enabled | bool
      no_log: true

    - name: Require non-placeholder backup provider configuration
      ansible.builtin.assert:
        that:
          - "'CHANGE_ME' not in vessel_backup_age_recipient"
          - "'CHANGE_ME' not in vessel_backup_spaces_bucket"
          - "'CHANGE_ME' not in vessel_backup_spaces_endpoint"
          - "'CHANGE_ME' not in vessel_backup_aws_access_key_id"
          - "'CHANGE_ME' not in vessel_backup_aws_secret_access_key"
        fail_msg: >-
          Production backups require approved encryption and object-storage
          credentials loaded through Ansible Vault.
      when: vessel_backups_enabled | bool
      no_log: true

    - name: Verify supported Ubuntu host
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version("24.04", ">=")
          - ansible_facts.architecture in ["x86_64", "aarch64"]
        fail_msg: This pinned Python 3.12 playbook requires Ubuntu 24.04 or newer.

    - name: Capture existing enabled Nginx sites
      ansible.builtin.find:
        paths: /etc/nginx/sites-enabled
        file_type: any
      register: nginx_sites_before
      changed_when: false

    - name: Check production TLS certificate before installing HTTPS config
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ vessel_domain }}/fullchain.pem"
      register: vessel_production_certificate
      when: vessel_tls_ready | bool

    - name: Require declared production certificate
      ansible.builtin.assert:
        that:
          - vessel_production_certificate.stat.exists
        fail_msg: Install/renew the production certificate or set vessel_tls_ready=false for ACME bootstrap.
      when: vessel_tls_ready | bool

  roles:
    - role: common
      tags: common
    - role: security
      tags: security
    - role: vessel_caller
      tags: application
    - role: nginx
      tags: nginx
    - role: backups
      tags: backups
    - role: monitoring
      tags: monitoring

  post_tasks:
    - name: Validate all Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Capture enabled Nginx sites after bootstrap
      ansible.builtin.find:
        paths: /etc/nginx/sites-enabled
        file_type: any
      register: nginx_sites_after
      changed_when: false

    - name: Assert no pre-existing Nginx site was removed
      ansible.builtin.assert:
        that:
          - >-
            (nginx_sites_before.files | map(attribute='path') | difference(
              nginx_sites_after.files | map(attribute='path')
            ) | list | length) == 0
        fail_msg: A pre-existing Nginx site disappeared; stop and restore it.

    - name: Verify FlexSchools remained reachable
      ansible.builtin.uri:
        url: "{{ vessel_flexschools_health_url }}"
        method: GET
        status_code:
          - 200
          - 301
          - 302
        timeout: 20
      changed_when: false
