limit_req_zone $binary_remote_addr zone=vessel_staging_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vessel_staging_api:10m rate=20r/s;
log_format vessel_staging_sanitized '$remote_addr - $remote_user [$time_local] '
                                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                    '"$http_user_agent" request_id=$request_id';
map $http_x_vessel_staging_proxy $vessel_staging_proxy_authorized {
    default 0;
    include /etc/nginx/vessel-caller/staging-proxy-map.conf;
}

upstream vessel_caller_staging_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging-api.vesselcalls.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://staging-api.vesselcalls.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-api.vesselcalls.com;

    ssl_certificate /etc/letsencrypt/live/staging-api.vesselcalls.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.vesselcalls.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VesselCallerStagingTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/vessel-caller-staging.access.log vessel_staging_sanitized;
    error_log /var/log/nginx/vessel-caller-staging.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /api/ {
        if ($vessel_staging_proxy_authorized = 0) {
            return 404;
        }
        limit_req zone=vessel_staging_api burst=40 nodelay;
        proxy_pass http://vessel_caller_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/api/(auth/(login|register|forgot-password|resend-verification|verify-email|reset-password|mfa/verify)|invitations/accept)$ {
        if ($vessel_staging_proxy_authorized = 0) {
            return 404;
        }
        limit_req zone=vessel_staging_auth burst=5 nodelay;
        proxy_pass http://vessel_caller_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        return 404;
    }
}
