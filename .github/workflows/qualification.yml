name: Qualify Staging Release for Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Current signed release deployed to staging
        required: true
        type: string
      previous_tag:
        description: Previous signed staging release used for the rollback drill
        required: true
        type: string

permissions:
  attestations: read
  contents: write

concurrency:
  group: vessel-caller-staging
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      ALERT_TEST_WEBHOOK_URL: ${{ secrets.ALERT_TEST_WEBHOOK_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      BACKUP_SPACES_BUCKET: ${{ vars.BACKUP_SPACES_BUCKET }}
      BACKUP_SPACES_ENDPOINT: ${{ vars.BACKUP_SPACES_ENDPOINT }}
      BACKUP_SPACES_REGION: ${{ vars.SPACES_REGION }}
      DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
      DROPLET_DEPLOY_SSH_KEY: ${{ secrets.DROPLET_DEPLOY_SSH_KEY }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
      LOAD_TEST_COOKIE: ${{ secrets.LOAD_TEST_COOKIE }}
      PRODUCTION_DATABASE_URL_SHA256: ${{ secrets.PRODUCTION_DATABASE_URL_SHA256 }}
      QUALIFICATION_SIGNING_PRIVATE_KEY: ${{ secrets.QUALIFICATION_SIGNING_PRIVATE_KEY }}
      QUALIFICATION_SIGNING_PUBLIC_KEY: ${{ vars.QUALIFICATION_SIGNING_PUBLIC_KEY }}
      OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY: ${{ vars.OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY }}
      RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
      RESEND_QUALIFICATION_API_KEY: ${{ secrets.RESEND_QUALIFICATION_API_KEY }}
      RESEND_QUALIFICATION_FROM: ${{ vars.RESEND_QUALIFICATION_FROM }}
      RESEND_QUALIFICATION_TO: ${{ secrets.RESEND_QUALIFICATION_TO }}
      RESTORE_DRILL_DATABASE_URL: ${{ secrets.RESTORE_DRILL_DATABASE_URL }}
      RESTORE_DRILL_SOURCE_URI: ${{ secrets.RESTORE_DRILL_SOURCE_URI }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
      SENTRY_PROJECT_SLUG: ${{ vars.SENTRY_PROJECT_SLUG }}
      SENTRY_QUALIFICATION_DSN: ${{ secrets.SENTRY_QUALIFICATION_DSN }}
      SPACES_QUALIFICATION_ACCESS_KEY_ID: ${{ secrets.SPACES_QUALIFICATION_ACCESS_KEY_ID }}
      SPACES_QUALIFICATION_BUCKET: ${{ vars.SPACES_QUALIFICATION_BUCKET }}
      SPACES_QUALIFICATION_ENDPOINT: ${{ vars.SPACES_QUALIFICATION_ENDPOINT }}
      SPACES_QUALIFICATION_REGION: ${{ vars.SPACES_QUALIFICATION_REGION }}
      SPACES_QUALIFICATION_SECRET_ACCESS_KEY: ${{ secrets.SPACES_QUALIFICATION_SECRET_ACCESS_KEY }}
      STAGING_DATABASE_CLUSTER_ID: ${{ vars.STAGING_DATABASE_CLUSTER_ID }}
      STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require distinct semantic releases before provider gates
        env:
          CURRENT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          semantic_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "${CURRENT_TAG}" =~ ${semantic_tag} ]]
          [[ "${PREVIOUS_TAG}" =~ ${semantic_tag} ]]
          if [[ "${CURRENT_TAG}" == "${PREVIOUS_TAG}" ]]; then
            echo "Rollback qualification requires two distinct release tags." >&2
            exit 1
          fi
          current_commit="$(git rev-parse --verify "${CURRENT_TAG}^{commit}")"
          previous_commit="$(git rev-parse --verify "${PREVIOUS_TAG}^{commit}")"
          if [[ "${current_commit}" == "${previous_commit}" ]]; then
            echo "Rollback qualification requires releases from distinct commits." >&2
            exit 1
          fi
          for tag in "${CURRENT_TAG}" "${PREVIOUS_TAG}"; do
            tag_object="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object'
            )"
            if [[ "$(jq -r '.type' <<<"${tag_object}")" != "tag" ]]; then
              echo "Qualification requires annotated release tags." >&2
              exit 1
            fi
            tag_sha="$(jq -r '.sha' <<<"${tag_object}")"
            verified="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
                --jq '.verification.verified'
            )"
            if [[ "${verified}" != "true" ]]; then
              echo "GitHub did not verify the release tag signature for ${tag}." >&2
              exit 1
            fi
          done
      - name: Require every qualification credential before running gates
        shell: bash
        run: |
          required=(
            ALERT_TEST_WEBHOOK_URL
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            BACKUP_AGE_IDENTITY
            BACKUP_SPACES_BUCKET
            BACKUP_SPACES_ENDPOINT
            BACKUP_SPACES_REGION
            DIGITALOCEAN_API_TOKEN
            DROPLET_DEPLOY_SSH_KEY
            DROPLET_HOST
            DROPLET_HOST_KEY
            LOAD_TEST_COOKIE
            PRODUCTION_DATABASE_URL_SHA256
            QUALIFICATION_SIGNING_PRIVATE_KEY
            QUALIFICATION_SIGNING_PUBLIC_KEY
            OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY
            RELEASE_SIGNING_PUBLIC_KEY
            RESEND_QUALIFICATION_API_KEY
            RESEND_QUALIFICATION_FROM
            RESEND_QUALIFICATION_TO
            RESTORE_DRILL_DATABASE_URL
            RESTORE_DRILL_SOURCE_URI
            SENTRY_AUTH_TOKEN
            SENTRY_ORG_SLUG
            SENTRY_PROJECT_SLUG
            SENTRY_QUALIFICATION_DSN
            SPACES_QUALIFICATION_ACCESS_KEY_ID
            SPACES_QUALIFICATION_BUCKET
            SPACES_QUALIFICATION_ENDPOINT
            SPACES_QUALIFICATION_REGION
            SPACES_QUALIFICATION_SECRET_ACCESS_KEY
            STAGING_DATABASE_CLUSTER_ID
            STAGING_E2E_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required staging qualification configuration: %s\n' \
              "$(IFS=', '; echo "${missing[*]}")" >&2
            exit 1
          fi
      - name: Verify immutable release archives before tag-controlled gates
        env:
          CURRENT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          mkdir -p artifacts
          release_public_key="$(mktemp)"
          trap 'rm -f "${release_public_key}"' EXIT
          printf '%s' "${RELEASE_SIGNING_PUBLIC_KEY}" > "${release_public_key}"
          for tag in "${CURRENT_TAG}" "${PREVIOUS_TAG}"; do
            gh release download "${tag}" \
              --dir artifacts \
              --pattern "vessel-caller-${tag}.tar.gz*"
            (
              cd artifacts
              sha256sum --check "vessel-caller-${tag}.tar.gz.sha256"
            )
            archive="artifacts/vessel-caller-${tag}.tar.gz"
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
            openssl dgst \
              -sha256 \
              -verify "${release_public_key}" \
              -signature "${archive}.sig" \
              "${archive}"
            resolved_commit="$(git rev-parse --verify "${tag}^{commit}")"
            tar -xOf \
              "${archive}" \
              "vessel-caller-${tag}/RELEASE.json" |
              jq --exit-status \
                --arg release "${tag}" \
                --arg commit "${resolved_commit}" \
                '.schemaVersion == 1
                 and .immutable == true
                 and .release == $release
                 and .commit == $commit' >/dev/null
          done

  load:
    needs: preflight
    uses: ./.github/workflows/load.yml
    with:
      release: ${{ inputs.tag }}
    secrets: inherit

  dast:
    needs: preflight
    uses: ./.github/workflows/dast.yml
    with:
      release: ${{ inputs.tag }}
    secrets: inherit

  restore-rollback-alert:
    needs:
      - load
      - dast
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    env:
      CURRENT_TAG: ${{ inputs.tag }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate signed release archives and staging deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY: ${{ vars.OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [[ "${CURRENT_TAG}" == "${PREVIOUS_TAG}" ]]; then
            echo "Rollback qualification requires two distinct release tags." >&2
            exit 1
          fi
          current_commit="$(git rev-parse --verify "${CURRENT_TAG}^{commit}")"
          previous_commit="$(git rev-parse --verify "${PREVIOUS_TAG}^{commit}")"
          if [[ "${current_commit}" == "${previous_commit}" ]]; then
            echo "Rollback qualification requires releases from distinct commits." >&2
            exit 1
          fi
          mkdir -p artifacts
          release_public_key="$(mktemp)"
          operator_public_key="$(mktemp)"
          trap 'rm -f "${release_public_key}" "${operator_public_key}"' EXIT
          printf '%s' "${RELEASE_SIGNING_PUBLIC_KEY}" > "${release_public_key}"
          printf '%s' "${OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY}" > "${operator_public_key}"
          for tag in "${CURRENT_TAG}" "${PREVIOUS_TAG}"; do
            [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
            tag_object="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object'
            )"
            if [[ "$(jq -r '.type' <<<"${tag_object}")" != "tag" ]]; then
              echo "Qualification requires annotated release tags." >&2
              exit 1
            fi
            tag_sha="$(jq -r '.sha' <<<"${tag_object}")"
            verified="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
                --jq '.verification.verified'
            )"
            if [[ "${verified}" != "true" ]]; then
              echo "GitHub did not verify the release tag signature for ${tag}." >&2
              exit 1
            fi
            gh release download "${tag}" \
              --dir artifacts \
              --pattern "vessel-caller-${tag}.tar.gz*"
            (
              cd artifacts
              sha256sum --check "vessel-caller-${tag}.tar.gz.sha256"
            )
            archive="artifacts/vessel-caller-${tag}.tar.gz"
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
            openssl dgst \
              -sha256 \
              -verify "${release_public_key}" \
              -signature "${archive}.sig" \
              "${archive}"
            resolved_commit="$(git rev-parse --verify "${tag}^{commit}")"
            tar -xOf \
              "${archive}" \
              "vessel-caller-${tag}/RELEASE.json" |
              jq --exit-status \
                --arg release "${tag}" \
                --arg commit "${resolved_commit}" \
                '.schemaVersion == 1
                 and .immutable == true
                 and .release == $release
                 and .commit == $commit' >/dev/null
            # Deployments are GitHub's append-only release evidence.  Releases
            # are immutable once published, so a later staging deployment must
            # not be represented by trying to upload another release asset.
            deployment_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/deployments?ref=${tag}&environment=staging&per_page=100" |
                jq -r \
                  --arg commit "${resolved_commit}" \
                  '[.[] | select(.environment == "staging" and .sha == $commit) | .id] | first // empty'
            )"
            test -n "${deployment_id}"
            gh api \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=100" \
              --jq '
                any(
                  .[];
                  .state == "success" and
                  .environment == "staging" and
                  .environment_url == "https://staging.vesselcalls.com"
                )
              ' | grep -qx true
          done
          operator_evidence="vessel-caller-${CURRENT_TAG}.operator-evidence.json"
          gh release download "${CURRENT_TAG}" \
            --dir artifacts \
            --pattern "${operator_evidence}"
          gh release download "${CURRENT_TAG}" \
            --dir artifacts \
            --pattern "${operator_evidence}.sig"
          openssl dgst \
            -sha256 \
            -verify "${operator_public_key}" \
            -signature "artifacts/${operator_evidence}.sig" \
            "artifacts/${operator_evidence}"
          jq --exit-status \
            --arg release "${CURRENT_TAG}" \
            --arg commit "${current_commit}" \
            '
              keys == ["commit", "controls", "evidenceType", "release", "schemaVersion"] and
              .schemaVersion == 1 and
              .evidenceType == "vessel-caller-operator-evidence" and
              .release == $release and
              .commit == $commit and
              (.controls | keys == [
                "applicationResendJourneys",
                "flexschoolsRegressionReviewed",
                "operatorChecklistSigned",
                "pitrPointInTimeRestore",
                "privateSpacesApplicationAuthorization",
                "productUatSigned",
                "resendForcedFailureVisibility",
                "resendRetryIdempotency",
                "rpoMinutes",
                "sentryBackendFrontendMetadataRedaction",
                "sentryOnCallAcknowledged",
                "stagingE2eAccountsProtected"
              ]) and
              (.controls.rpoMinutes | type == "number" and . >= 0 and . <= 15) and
              ([
                .controls.applicationResendJourneys,
                .controls.flexschoolsRegressionReviewed,
                .controls.operatorChecklistSigned,
                .controls.pitrPointInTimeRestore,
                .controls.privateSpacesApplicationAuthorization,
                .controls.productUatSigned,
                .controls.resendForcedFailureVisibility,
                .controls.resendRetryIdempotency,
                .controls.sentryBackendFrontendMetadataRedaction,
                .controls.sentryOnCallAcknowledged,
                .controls.stagingE2eAccountsProtected
              ] | all(. == true))
            ' \
            "artifacts/${operator_evidence}" >/dev/null
          operator_evidence_sha256="$(
            sha256sum "artifacts/${operator_evidence}" | awk '{print $1}'
          )"
          echo "OPERATOR_EVIDENCE_SHA256=${operator_evidence_sha256}" >> "${GITHUB_ENV}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${CURRENT_TAG}^{commit}")"
          deploy/scripts/smoke-test.sh \
            --qualify-release \
            https://staging.vesselcalls.com \
            "${CURRENT_TAG}"
      - name: Run automated staging browser integration checks
        env:
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          PLAYWRIGHT_BASE_URL: https://staging.vesselcalls.com
          PLAYWRIGHT_REAL_BACKEND: "1"
        run: |
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps
          npm run e2e
      - name: Run WCAG 2.2 AA automated staging scan
        env:
          ACCESSIBILITY_BASE_URL: https://staging.vesselcalls.com
        working-directory: frontend
        run: |
          npm install \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            @axe-core/playwright@4.10.2
          node --input-type=module <<'EOF'
          import AxeBuilder from "@axe-core/playwright";
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch();
          try {
            const context = await browser.newContext();
            for (const path of ["/", "/login", "/register"]) {
              const page = await context.newPage();
              await page.goto(`${process.env.ACCESSIBILITY_BASE_URL}${path}`, {
                waitUntil: "networkidle",
              });
              const result = await new AxeBuilder({ page })
                .withTags(["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"])
                .analyze();
              if (result.violations.length) {
                console.error(JSON.stringify({ path, violations: result.violations }, null, 2));
                process.exitCode = 1;
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }
          EOF
      - name: Verify Resend transport delivery
        env:
          RESEND_QUALIFICATION_API_KEY: ${{ secrets.RESEND_QUALIFICATION_API_KEY }}
          RESEND_QUALIFICATION_FROM: ${{ vars.RESEND_QUALIFICATION_FROM }}
          RESEND_QUALIFICATION_TO: ${{ secrets.RESEND_QUALIFICATION_TO }}
        run: |
          request_id="vessel-caller-${CURRENT_TAG}-${GITHUB_RUN_ID}"
          response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${RESEND_QUALIFICATION_API_KEY}" \
              --header "Content-Type: application/json" \
              --header "Idempotency-Key: ${request_id}" \
              --data "$(
                jq -n \
                  --arg from "${RESEND_QUALIFICATION_FROM}" \
                  --arg to "${RESEND_QUALIFICATION_TO}" \
                  --arg subject "Vessel Caller ${CURRENT_TAG} Resend qualification" \
                  '{
                    from: $from,
                    to: [$to],
                    subject: $subject,
                    html: "<p>Automated staging delivery qualification.</p>"
                  }'
              )" \
              https://api.resend.com/emails
          )"
          email_id="$(jq -er '.id' <<<"${response}")"
          delivered=false
          for _attempt in {1..30}; do
            status="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --header "Authorization: Bearer ${RESEND_QUALIFICATION_API_KEY}" \
                "https://api.resend.com/emails/${email_id}" |
                jq -er '.last_event'
            )"
            if [[ "${status}" == "delivered" ]]; then
              delivered=true
              break
            fi
            if [[ "${status}" == "bounced" || "${status}" == "complained" ]]; then
              echo "Resend qualification message reached terminal status ${status}." >&2
              exit 1
            fi
            sleep 10
          done
          test "${delivered}" = true
      - name: Verify private Spaces authorization and backup recovery controls
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_QUALIFICATION_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_QUALIFICATION_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SPACES_QUALIFICATION_REGION }}
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          BACKUP_SPACES_BUCKET: ${{ vars.BACKUP_SPACES_BUCKET }}
          BACKUP_SPACES_ENDPOINT: ${{ vars.BACKUP_SPACES_ENDPOINT }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          SPACES_QUALIFICATION_BUCKET: ${{ vars.SPACES_QUALIFICATION_BUCKET }}
          SPACES_QUALIFICATION_ENDPOINT: ${{ vars.SPACES_QUALIFICATION_ENDPOINT }}
          STAGING_DATABASE_CLUSTER_ID: ${{ vars.STAGING_DATABASE_CLUSTER_ID }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes awscli
          object_key="qualification/${CURRENT_TAG}/${GITHUB_RUN_ID}.txt"
          object_file="${RUNNER_TEMP}/spaces-qualification.txt"
          printf 'Vessel Caller qualification %s\n' "${CURRENT_TAG}" > "${object_file}"
          cleanup() {
            aws \
              --endpoint-url "${SPACES_QUALIFICATION_ENDPOINT}" \
              s3api delete-object \
              --bucket "${SPACES_QUALIFICATION_BUCKET}" \
              --key "${object_key}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          aws \
            --endpoint-url "${SPACES_QUALIFICATION_ENDPOINT}" \
            s3api put-object \
            --bucket "${SPACES_QUALIFICATION_BUCKET}" \
            --key "${object_key}" \
            --body "${object_file}" >/dev/null
          aws \
            --endpoint-url "${SPACES_QUALIFICATION_ENDPOINT}" \
            s3api head-object \
            --bucket "${SPACES_QUALIFICATION_BUCKET}" \
            --key "${object_key}" >/dev/null
          anonymous_status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${SPACES_QUALIFICATION_ENDPOINT}/${SPACES_QUALIFICATION_BUCKET}/${object_key}"
          )"
          [[ "${anonymous_status}" == "401" || "${anonymous_status}" == "403" ]]
          backup_versioning="$(
            AWS_ACCESS_KEY_ID="${BACKUP_AWS_ACCESS_KEY_ID}" \
            AWS_SECRET_ACCESS_KEY="${BACKUP_AWS_SECRET_ACCESS_KEY}" \
            aws \
              --endpoint-url "${BACKUP_SPACES_ENDPOINT}" \
              s3api get-bucket-versioning \
              --bucket "${BACKUP_SPACES_BUCKET}"
          )"
          jq --exit-status '.Status == "Enabled"' <<<"${backup_versioning}" >/dev/null
          backups="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${DIGITALOCEAN_API_TOKEN}" \
              "https://api.digitalocean.com/v2/databases/${STAGING_DATABASE_CLUSTER_ID}/backups"
          )"
          jq --exit-status \
            '(.backups | type == "array") and (.backups | length > 0)' \
            <<<"${backups}" >/dev/null
          cleanup
          trap - EXIT
      - name: Verify Sentry ingestion and alert-rule presence
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT_SLUG: ${{ vars.SENTRY_PROJECT_SLUG }}
          SENTRY_QUALIFICATION_DSN: ${{ secrets.SENTRY_QUALIFICATION_DSN }}
        run: |
          event_id="$(openssl rand -hex 16)"
          export event_id
          envelope="${RUNNER_TEMP}/sentry-envelope"
          envelope_url="$(python - "${envelope}" <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlparse

          dsn = urlparse(os.environ["SENTRY_QUALIFICATION_DSN"])
          project_id = dsn.path.strip("/")
          if not dsn.hostname or not dsn.username or not project_id:
              raise SystemExit("SENTRY_QUALIFICATION_DSN is invalid")
          event_id = os.environ["event_id"]
          envelope = [
              json.dumps({"event_id": event_id, "dsn": os.environ["SENTRY_QUALIFICATION_DSN"]}),
              json.dumps({"type": "event"}),
              json.dumps(
                  {
                      "event_id": event_id,
                      "platform": "other",
                      "level": "error",
                      "message": "Vessel Caller qualification alert",
                      "environment": "staging",
                      "release": os.environ["CURRENT_TAG"],
                      "fingerprint": ["vessel-caller-qualification-alert"],
                  }
              ),
          ]
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write("\n".join(envelope) + "\n")
          print(f"https://{dsn.hostname}/api/{project_id}/envelope/")
          PY
          )"
          curl \
            --fail \
            --silent \
            --show-error \
            --header "Content-Type: application/x-sentry-envelope" \
            --data-binary "@${envelope}" \
            "${envelope_url}" >/dev/null
          observed=false
          for _attempt in {1..18}; do
            status="$(
              curl \
                --silent \
                --show-error \
                --output "${RUNNER_TEMP}/sentry-event.json" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
                "https://sentry.io/api/0/projects/${SENTRY_ORG_SLUG}/${SENTRY_PROJECT_SLUG}/events/${event_id}/"
            )"
            if [[ "${status}" == "200" ]]; then
              jq --exit-status \
                --arg event_id "${event_id}" \
                '.eventID == $event_id' \
                "${RUNNER_TEMP}/sentry-event.json" >/dev/null
              observed=true
              break
            fi
            test "${status}" = "404"
            sleep 10
          done
          test "${observed}" = true
          curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://sentry.io/api/0/projects/${SENTRY_ORG_SLUG}/${SENTRY_PROJECT_SLUG}/rules/" |
            jq --exit-status \
              'type == "array" and any(.[]; .status == "active")' >/dev/null
      - name: Restore encrypted backup into the isolated drill database
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SPACES_REGION }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_SPACES_ENDPOINT: ${{ vars.BACKUP_SPACES_ENDPOINT }}
          RESTORE_DRILL_SOURCE_URI: ${{ secrets.RESTORE_DRILL_SOURCE_URI }}
          RESTORE_DRILL_DATABASE_URL: ${{ secrets.RESTORE_DRILL_DATABASE_URL }}
          PRODUCTION_DATABASE_URL_SHA256: ${{ secrets.PRODUCTION_DATABASE_URL_SHA256 }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli postgresql-client
          identity_file="${RUNNER_TEMP}/backup-age-identity"
          printf '%s' "${BACKUP_AGE_IDENTITY}" > "${identity_file}"
          chmod 0600 "${identity_file}"
          export BACKUP_AGE_IDENTITY_FILE="${identity_file}"
          export RESTORE_TARGET_ENVIRONMENT=drill
          export RESTORE_TARGET_DATABASE_URL="${RESTORE_DRILL_DATABASE_URL}"
          export RESTORE_RECONCILIATION_OUTPUT="${RUNNER_TEMP}/restore-source-manifest.json"
          export TARGET_DATABASE_URL_SHA256
          TARGET_DATABASE_URL_SHA256="$(
            printf '%s' "${RESTORE_DRILL_DATABASE_URL}" | sha256sum | awk '{print $1}'
          )"
          deploy/scripts/postgres-restore.sh \
            "${RESTORE_DRILL_SOURCE_URI}" \
            drill \
            --confirm-restore
          release_root="${RUNNER_TEMP}/restore-release"
          mkdir -p "${release_root}"
          tar -xzf "artifacts/vessel-caller-${CURRENT_TAG}.tar.gz" -C "${release_root}"
          payload="${release_root}/vessel-caller-${CURRENT_TAG}"
          python -m venv "${RUNNER_TEMP}/restore-venv"
          "${RUNNER_TEMP}/restore-venv/bin/pip" install \
            --no-index \
            --find-links "${payload}/wheelhouse" \
            --require-hashes \
            --requirement "${payload}/backend/requirements/production.txt"
          export VC_DATABASE_URL="${RESTORE_DRILL_DATABASE_URL}"
          export VC_SECRET_KEY="restore-drill-only-not-production"
          export DJANGO_SETTINGS_MODULE=vessel_caller.settings.development
          "${RUNNER_TEMP}/restore-venv/bin/python" "${payload}/backend/manage.py" migrate --noinput
          "${RUNNER_TEMP}/restore-venv/bin/python" "${payload}/backend/manage.py" migrate --check
          "${RUNNER_TEMP}/restore-venv/bin/python" "${payload}/backend/manage.py" check
          "${RUNNER_TEMP}/restore-venv/bin/python" "${payload}/backend/manage.py" makemigrations --check --dry-run
          reconciliation_state="${RUNNER_TEMP}/restore-reconciliation-state"
          mkdir -m 0700 "${reconciliation_state}"
          source "${payload}/deploy/scripts/libpq-env.sh"
          configure_libpq_from_env RESTORE_DRILL_DATABASE_URL "${reconciliation_state}"
          "${payload}/deploy/scripts/database-manifest.sh" \
            > "${RUNNER_TEMP}/restore-post-migration-manifest.json"
          jq --sort-keys \
            '{counts, financialTotals, foreignKeyOrphans}' \
            "${RUNNER_TEMP}/restore-source-manifest.json" \
            > "${RUNNER_TEMP}/restore-source-controls.json"
          jq --sort-keys \
            '{counts, financialTotals, foreignKeyOrphans}' \
            "${RUNNER_TEMP}/restore-post-migration-manifest.json" \
            > "${RUNNER_TEMP}/restore-post-migration-controls.json"
          diff -u \
            "${RUNNER_TEMP}/restore-source-controls.json" \
            "${RUNNER_TEMP}/restore-post-migration-controls.json"
          jq --exit-status \
            '([.foreignKeyOrphans[]] | all(. == 0))' \
            "${RUNNER_TEMP}/restore-post-migration-manifest.json" >/dev/null
      - name: Exercise full staging backend and frontend rollback and recovery
        env:
          DEPLOY_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_KEY: ${{ secrets.DROPLET_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_KEY}" > "${HOME}/.ssh/vessel-caller-deploy"
          chmod 0600 "${HOME}/.ssh/vessel-caller-deploy"
          printf '%s\n' "${HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"
          ssh_options=(-i "${HOME}/.ssh/vessel-caller-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          deploy_tag() {
            local tag="$1"
            local archive="vessel-caller-${tag}.tar.gz"
            scp "${ssh_options[@]}" \
              "artifacts/${archive}" \
              "artifacts/${archive}.sha256" \
              "artifacts/${archive}.sig" \
              "vessel-deploy@${DEPLOY_HOST}:/var/tmp/"
            printf -v remote_command \
              'sudo /usr/local/sbin/vessel-caller-deploy staging %q' \
              "/var/tmp/${archive}"
            # The fully shell-escaped command is intentionally constructed locally.
            # shellcheck disable=SC2029
            ssh "${ssh_options[@]}" "vessel-deploy@${DEPLOY_HOST}" \
              "${remote_command}"
          }
          restore_current() {
            set +e
            deploy_tag "${CURRENT_TAG}"
          }
          trap restore_current ERR INT TERM

          deploy_tag "${PREVIOUS_TAG}"
          deploy/scripts/smoke-test.sh \
            --qualify-release \
            https://staging.vesselcalls.com \
            "${PREVIOUS_TAG}"

          deploy_tag "${CURRENT_TAG}"
          deploy/scripts/smoke-test.sh \
            --qualify-release \
            https://staging.vesselcalls.com \
            "${CURRENT_TAG}"
          trap - ERR INT TERM
      - name: Exercise deployment alert channel
        env:
          ALERT_TEST_WEBHOOK_URL: ${{ secrets.ALERT_TEST_WEBHOOK_URL }}
        run: |
          test -n "${ALERT_TEST_WEBHOOK_URL}"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg text "Vessel Caller ${CURRENT_TAG} qualification alert test" '{text: $text}')" \
            "${ALERT_TEST_WEBHOOK_URL}" >/dev/null
      - name: Verify FlexSchools regression after all staging exercises
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 20 \
            https://flexschools.ng/ >/dev/null
      - name: Publish production qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_SIGNING_PRIVATE_KEY: ${{ secrets.QUALIFICATION_SIGNING_PRIVATE_KEY }}
          QUALIFICATION_SIGNING_PUBLIC_KEY: ${{ vars.QUALIFICATION_SIGNING_PUBLIC_KEY }}
        run: |
          evidence="artifacts/vessel-caller-${CURRENT_TAG}.production-qualified.json"
          jq -n \
            --arg release "${CURRENT_TAG}" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg previousRelease "${PREVIOUS_TAG}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg qualifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg operatorEvidenceSha256 "${OPERATOR_EVIDENCE_SHA256}" \
            '{
              schemaVersion: 1,
              evidenceType: "vessel-caller-production-qualification",
              release: $release,
              commit: $commit,
              previousRelease: $previousRelease,
              workflowRunId: $workflowRunId,
              qualifiedAt: $qualifiedAt,
              operatorEvidenceSha256: $operatorEvidenceSha256,
              gates: {
                stagingReleaseIdentity: true,
                migrationParity: true,
                uat: true,
                accessibility: true,
                load: true,
                dast: true,
                restore: true,
                rollbackAndRecovery: true,
                resendDelivery: true,
                privateSpacesAuthorization: true,
                backupVersioningAndPitr: true,
                sentryAlert: true,
                flexschoolsRegression: true
              },
              qualified: true
            }' > "${evidence}"
          jq --exit-status \
            --arg release "${CURRENT_TAG}" \
            --arg commit "$(git rev-parse HEAD)" \
            '
              .schemaVersion == 1 and
              .evidenceType == "vessel-caller-production-qualification" and
              .release == $release and
              .commit == $commit and
              (.operatorEvidenceSha256 | test("^[0-9a-f]{64}$")) and
              .qualified == true and
              (.gates | type == "object") and
              (.gates | keys == [
                "accessibility",
                "backupVersioningAndPitr",
                "dast",
                "flexschoolsRegression",
                "load",
                "migrationParity",
                "privateSpacesAuthorization",
                "resendDelivery",
                "restore",
                "rollbackAndRecovery",
                "sentryAlert",
                "stagingReleaseIdentity",
                "uat"
              ]) and
              ([.gates[]] | all(. == true))
            ' \
            "${evidence}" >/dev/null
          private_key="$(mktemp)"
          public_key="$(mktemp)"
          trap 'rm -f "${private_key}" "${public_key}"' EXIT
          printf '%s' "${QUALIFICATION_SIGNING_PRIVATE_KEY}" > "${private_key}"
          printf '%s' "${QUALIFICATION_SIGNING_PUBLIC_KEY}" > "${public_key}"
          chmod 0600 "${private_key}"
          openssl dgst -sha256 -sign "${private_key}" -out "${evidence}.sig" "${evidence}"
          openssl dgst \
            -sha256 \
            -verify "${public_key}" \
            -signature "${evidence}.sig" \
            "${evidence}"
          gh release upload "${CURRENT_TAG}" "${evidence}" "${evidence}.sig"
