name: External Production Synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: vessel-caller-production-synthetic
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Vessel Caller externally
        id: vessel
        continue-on-error: true
        run: deploy/scripts/smoke-test.sh --availability-only https://vesselcalls.com
      - name: Verify FlexSchools isolation
        id: flexschools
        if: always()
        continue-on-error: true
        run: >-
          curl
          --fail
          --silent
          --show-error
          --location
          --max-time 20
          https://flexschools.ng/
      - name: Require both synthetic checks to pass
        if: always()
        env:
          FLEXSCHOOLS_OUTCOME: ${{ steps.flexschools.outcome }}
          VESSEL_OUTCOME: ${{ steps.vessel.outcome }}
        run: |
          failed=0
          if [[ "${VESSEL_OUTCOME}" != "success" ]]; then
            echo "Vessel Caller production availability failed." >&2
            failed=1
          fi
          if [[ "${FLEXSCHOOLS_OUTCOME}" != "success" ]]; then
            echo "FlexSchools isolation check failed." >&2
            failed=1
          fi
          exit "${failed}"
