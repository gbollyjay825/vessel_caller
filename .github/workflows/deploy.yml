name: Promote Release to Droplet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published signed release tag
        required: true
        type: string
      target:
        description: Protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  attestations: read
  contents: write
  deployments: write

concurrency:
  group: vessel-caller-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://vesselcalls.com' || 'https://staging.vesselcalls.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
      - name: Validate requested release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic vMAJOR.MINOR.PATCH syntax." >&2
            exit 1
          fi
      - name: Require deployment credentials before any server mutation
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          DROPLET_DEPLOY_SSH_KEY: ${{ secrets.DROPLET_DEPLOY_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
          OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY: ${{ vars.OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY }}
          QUALIFICATION_SIGNING_PUBLIC_KEY: ${{ vars.QUALIFICATION_SIGNING_PUBLIC_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: |
          required=(
            DROPLET_DEPLOY_SSH_KEY
            DROPLET_HOST
            DROPLET_HOST_KEY
            RELEASE_SIGNING_PUBLIC_KEY
          )
          if [[ "${DEPLOY_TARGET}" == "staging" ]]; then
            required+=(
              STAGING_E2E_PASSWORD
            )
          else
            required+=(
              OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY
              QUALIFICATION_SIGNING_PUBLIC_KEY
            )
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'DEFERRED: missing required %s deployment configuration: %s\n' \
              "${DEPLOY_TARGET}" \
              "$(IFS=', '; echo "${missing[*]}")" >&2
            exit 1
          fi
      - name: Download immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" --dir artifacts --pattern "vessel-caller-${RELEASE_TAG}.tar.gz*"
          cd artifacts
          sha256sum --check "vessel-caller-${RELEASE_TAG}.tar.gz.sha256"
          gh attestation verify "vessel-caller-${RELEASE_TAG}.tar.gz" --repo "${GITHUB_REPOSITORY}"
          public_key="$(mktemp)"
          trap 'rm -f "${public_key}"' EXIT
          printf '%s' "${RELEASE_SIGNING_PUBLIC_KEY}" > "${public_key}"
          openssl dgst \
            -sha256 \
            -verify "${public_key}" \
            -signature "vessel-caller-${RELEASE_TAG}.tar.gz.sig" \
            "vessel-caller-${RELEASE_TAG}.tar.gz"
      - name: Enforce signed release target policy
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # The archive was checksum-, attestation-, and signature-verified in
          # the immediately preceding step. Keep this control in the workflow
          # so legacy tag checkouts need not contain the policy helper. The
          # root-owned host entrypoint independently repeats the same check.
          archive="artifacts/vessel-caller-${RELEASE_TAG}.tar.gz"
          manifest="$(tar -xOf "${archive}" "vessel-caller-${RELEASE_TAG}/RELEASE.json")"
          jq --exit-status \
            '.schemaVersion == 1 and .application == "vessel-caller"' \
            <<<"${manifest}" >/dev/null
          if [[ "${DEPLOY_TARGET}" == "production" ]] \
            && jq --exit-status '.stagingOnlySchemaCutover == true' \
              <<<"${manifest}" >/dev/null; then
            echo "This signed release is restricted to staging; production deployment is blocked." >&2
            exit 1
          fi
          if [[ "${DEPLOY_TARGET}" == "staging" ]] \
            && ! jq --exit-status '.organizationApprovalLifecycle == true' \
              <<<"${manifest}" >/dev/null; then
            echo "This release predates the irreversible staging approval-lifecycle floor." >&2
            exit 1
          fi
      - name: Require full recorded qualification before production
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY: ${{ vars.OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          QUALIFICATION_SIGNING_PUBLIC_KEY: ${{ vars.QUALIFICATION_SIGNING_PUBLIC_KEY }}
        run: |
          evidence="vessel-caller-${RELEASE_TAG}.production-qualified.json"
          gh release download "${RELEASE_TAG}" --dir artifacts --pattern "${evidence}*"
          public_key="$(mktemp)"
          trap 'rm -f "${public_key}"' EXIT
          printf '%s' "${QUALIFICATION_SIGNING_PUBLIC_KEY}" > "${public_key}"
          openssl dgst \
            -sha256 \
            -verify "${public_key}" \
            -signature "artifacts/${evidence}.sig" \
            "artifacts/${evidence}"
          jq --exit-status \
            --arg tag "${RELEASE_TAG}" \
            --arg commit "$(git rev-parse HEAD)" \
            '
              .schemaVersion == 1 and
              .evidenceType == "vessel-caller-production-qualification" and
              .release == $tag and
              .commit == $commit and
              (.operatorEvidenceSha256 | test("^[0-9a-f]{64}$")) and
              .qualified == true and
              (.gates | type == "object") and
              (.gates | keys == [
                "accessibility",
                "backupVersioningAndPitr",
                "dast",
                "flexschoolsRegression",
                "load",
                "migrationParity",
                "privateSpacesAuthorization",
                "resendDelivery",
                "restore",
                "rollbackAndRecovery",
                "sentryAlert",
                "stagingReleaseIdentity",
                "uat"
              ]) and
              ([.gates[]] | all(. == true))
            ' \
            "artifacts/${evidence}" >/dev/null
          operator_evidence="vessel-caller-${RELEASE_TAG}.operator-evidence.json"
          gh release download "${RELEASE_TAG}" \
            --dir artifacts \
            --pattern "${operator_evidence}"
          gh release download "${RELEASE_TAG}" \
            --dir artifacts \
            --pattern "${operator_evidence}.sig"
          operator_public_key="$(mktemp)"
          trap 'rm -f "${public_key}" "${operator_public_key}"' EXIT
          printf '%s' "${OPERATOR_EVIDENCE_SIGNING_PUBLIC_KEY}" > "${operator_public_key}"
          openssl dgst \
            -sha256 \
            -verify "${operator_public_key}" \
            -signature "artifacts/${operator_evidence}.sig" \
            "artifacts/${operator_evidence}"
          operator_evidence_sha256="$(
            sha256sum "artifacts/${operator_evidence}" | awk '{print $1}'
          )"
          expected_operator_evidence_sha256="$(
            jq -r '.operatorEvidenceSha256' "artifacts/${evidence}"
          )"
          test "${operator_evidence_sha256}" = "${expected_operator_evidence_sha256}"
          jq --exit-status \
            --arg release "${RELEASE_TAG}" \
            --arg commit "$(git rev-parse HEAD)" \
            '
              keys == ["commit", "controls", "evidenceType", "release", "schemaVersion"] and
              .schemaVersion == 1 and
              .evidenceType == "vessel-caller-operator-evidence" and
              .release == $release and
              .commit == $commit and
              (.controls | keys == [
                "applicationResendJourneys",
                "flexschoolsRegressionReviewed",
                "operatorChecklistSigned",
                "pitrPointInTimeRestore",
                "privateSpacesApplicationAuthorization",
                "productUatSigned",
                "resendForcedFailureVisibility",
                "resendRetryIdempotency",
                "rpoMinutes",
                "sentryBackendFrontendMetadataRedaction",
                "sentryOnCallAcknowledged",
                "stagingE2eAccountsProtected"
              ]) and
              (.controls.rpoMinutes | type == "number" and . >= 0 and . <= 15) and
              ([
                .controls.applicationResendJourneys,
                .controls.flexschoolsRegressionReviewed,
                .controls.operatorChecklistSigned,
                .controls.pitrPointInTimeRestore,
                .controls.privateSpacesApplicationAuthorization,
                .controls.productUatSigned,
                .controls.resendForcedFailureVisibility,
                .controls.resendRetryIdempotency,
                .controls.sentryBackendFrontendMetadataRedaction,
                .controls.sentryOnCallAcknowledged,
                .controls.stagingE2eAccountsProtected
              ] | all(. == true))
            ' \
            "artifacts/${operator_evidence}" >/dev/null
      - name: Configure pinned SSH connection
        env:
          SSH_KEY: ${{ secrets.DROPLET_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_KEY}" > "${HOME}/.ssh/vessel-caller-deploy"
          chmod 0600 "${HOME}/.ssh/vessel-caller-deploy"
          printf '%s\n' "${HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"
      - name: Upload and install inactive release
        env:
          DEPLOY_HOST: ${{ secrets.DROPLET_HOST }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          archive="vessel-caller-${RELEASE_TAG}.tar.gz"
          ssh_options=(-i "${HOME}/.ssh/vessel-caller-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          # The restricted deploy account intentionally accepts only the
          # legacy scp sink command for /var/tmp release artifacts.  Newer
          # OpenSSH clients default to SFTP, which has no shell command for
          # the forced-command boundary to validate.
          scp -O "${ssh_options[@]}" \
            "artifacts/${archive}" \
            "artifacts/${archive}.sha256" \
            "artifacts/${archive}.sig" \
            "vessel-deploy@${DEPLOY_HOST}:/var/tmp/"
          printf -v remote_command \
            'sudo /usr/local/sbin/vessel-caller-deploy %q %q' \
            "${TARGET}" \
            "/var/tmp/${archive}"
          # The fully shell-escaped command is intentionally constructed locally.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "vessel-deploy@${DEPLOY_HOST}" \
            "${remote_command}"
      - uses: actions/setup-node@v7
        if: inputs.target == 'staging'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify immutable staging or production release and FlexSchools isolation
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${TARGET}" == "production" ]]; then
            deploy/scripts/smoke-test.sh \
              --qualify-release \
              https://vesselcalls.com \
              "${RELEASE_TAG}"
          else
            deploy/scripts/smoke-test.sh \
              --qualify-release \
              https://staging.vesselcalls.com \
              "${RELEASE_TAG}"
          fi
          curl --fail --silent --show-error --location --max-time 20 https://flexschools.ng/ >/dev/null
      - name: Run staging browser gate against the deployed preview
        if: inputs.target == 'staging'
        env:
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          PLAYWRIGHT_BASE_URL: https://staging.vesselcalls.com
          PLAYWRIGHT_REAL_BACKEND: "1"
        run: |
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps
          npm run e2e
      - name: Record successful staging deployment
        if: inputs.target == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Immutable GitHub releases cannot accept post-publication assets.
          # GitHub Deployments is the append-only release evidence record.
          deployment_id="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="${RELEASE_TAG}" \
            -f environment=staging \
            -f description="Verified staging deployment from workflow ${GITHUB_RUN_ID}" \
            -F auto_merge=false \
            --jq .id)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=success \
            -f environment=staging \
            -f environment_url=https://staging.vesselcalls.com \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Immutable ${RELEASE_TAG} verified on staging" >/dev/null
