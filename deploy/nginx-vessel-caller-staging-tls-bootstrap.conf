server {
    listen 80;
    listen [::]:80;
    server_name staging-api.vesselcalls.com staging.vesselcalls.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.vesselcalls.com;

    ssl_certificate /etc/letsencrypt/live/staging-api.vesselcalls.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.vesselcalls.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VesselCallerStagingBootstrapTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        return 503;
    }
}
